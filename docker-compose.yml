services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: admin_template
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Depuis Postgres 18, l'image attend le montage sur /var/lib/postgresql
      # (et non /var/lib/postgresql/data) — voir docker-library/postgres#1259
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d admin_template"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:
